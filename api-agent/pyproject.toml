[project]
name = "eicat-ai"
version = "0.1.0"
description = "AI tools for assisting in the generation of EICAT assessments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elsapy>=0.5.1",
    "pandas>=2.3.3",
    "pybliometrics>=4.3",
    "pydantic-ai-slim[a2a,ag-ui]>=1.0.13",
    "pydantic-ai[ag-ui]>=1.0.13",
    "pygbif>=0.6.5",
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
