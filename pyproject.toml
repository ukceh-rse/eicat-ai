[project]
name = "eicat-ai"
version = "0.1.0"
description = "AI tools for assisting in the generation of EICAT assessments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elsapy>=0.5.1",
    "pandas>=2.3.3",
    "pybliometrics>=4.3",
    "pydantic-ai>=1.0.13",
    "pygbif>=0.6.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "pytest>=8.4.2",
]
