[project]
name = "eicat-ai-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic-ai[bedrock]>=1.0",
    "krippendorff>=0.6",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
